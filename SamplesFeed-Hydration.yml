parameters:
- name: HydrationMode
  type: string
  default: Branch
  values:
  - Branch
  - ValidateOnly
  - WindowsAppSDKVersion

trigger: none
pr: none

variables:
  HydrationTarget: $[coalesce(variables['BranchOrVersion'], '')]

pool:
  vmImage: windows-2022

jobs:
- job: TestQueueVariable
  timeoutInMinutes: 10
  steps:
  - checkout: self

  - task: PowerShell@2
    displayName: Test target resolver without accessing feeds
    inputs:
      targetType: inline
      script: |
        Import-Module Pester -RequiredVersion 3.4.0
        $result = Invoke-Pester '$(Build.SourcesDirectory)\eng\Tests\ResolveSamplesFeedTarget.Tests.ps1' -PassThru
        if ($result.FailedCount -gt 0)
        {
            throw "$($result.FailedCount) target resolver tests failed."
        }

  - task: PowerShell@2
    displayName: Validate and resolve hydration target
    inputs:
      filePath: '$(Build.SourcesDirectory)\eng\ResolveSamplesFeedTarget.ps1'
      arguments: -HydrationMode ${{ parameters.HydrationMode }}
    env:
      HYDRATION_TARGET: $(HydrationTarget)
      # Use a protected triggering-ref fixture on this diagnostic-only branch.
      BUILD_SOURCEBRANCH: refs/heads/release/hosted-target-test

  - task: PowerShell@2
    displayName: Verify queue input reached the next step
    inputs:
      targetType: inline
      script: |
        if ($env:TEST_MODE -eq 'WindowsAppSDKVersion')
        {
            if ($env:RESOLVED_VERSION -ne $env:HYDRATION_TARGET)
            {
                throw 'Queue-time version did not reach the consumer.'
            }
            Write-Host "Resolved explicit version: $env:RESOLVED_VERSION"
        }
        else
        {
            $expected = if ([string]::IsNullOrWhiteSpace($env:HYDRATION_TARGET))
            {
                'release/hosted-target-test'
            }
            else
            {
                $env:HYDRATION_TARGET.Trim()
            }
            if ($env:RESOLVED_BRANCH -ne $expected)
            {
                throw 'Queue-time branch did not reach the consumer.'
            }
            Write-Host "Resolved branch: $env:RESOLVED_BRANCH"
        }
        Write-Host 'No authentication or feed-management tasks exist in this test pipeline.'
    env:
      TEST_MODE: ${{ parameters.HydrationMode }}
      HYDRATION_TARGET: $(HydrationTarget)
      RESOLVED_BRANCH: $(EffectiveSamplesBranch)
      RESOLVED_VERSION: $(EffectiveWindowsAppSDKVersion)
