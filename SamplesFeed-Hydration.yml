trigger: none
pr: none

pool:
  vmImage: windows-2022

jobs:
- job: CompareNuGetConnectivity
  displayName: Compare direct NuGet and CFS connectivity
  timeoutInMinutes: 15
  steps:
  - checkout: none

  - task: NuGetToolInstaller@1
    displayName: Use NuGet

  - task: PowerShell@2
    displayName: Probe service indexes and SDK 2.7.0 downloads
    inputs:
      targetType: inline
      script: |
        $ErrorActionPreference = 'Stop'
        $sources = [ordered]@{
            NuGetOrg = 'https://api.nuget.org/v3/index.json'
            CfsProxy = 'https://packagefeedproxy.microsoft.io/nuget/v3/index.json'
        }
        $results = @()
        foreach ($name in $sources.Keys)
        {
            $source = $sources[$name]
            Write-Host "=== $name service index ==="
            $indexStatus = 'Failed'
            try
            {
                $response = Invoke-WebRequest -Uri $source -UseBasicParsing -TimeoutSec 30
                $indexStatus = "HTTP $($response.StatusCode)"
                Write-Host $indexStatus
            }
            catch
            {
                $exception = $_.Exception
                while ($null -ne $exception)
                {
                    Write-Host "$($exception.GetType().Name): $($exception.Message)"
                    $exception = $exception.InnerException
                }
            }

            Write-Host "=== $name metapackage download (no dependencies) ==="
            $outputDirectory = Join-Path $env:AGENT_TEMPDIRECTORY "$name-packages"
            $ErrorActionPreference = 'Continue'
            & nuget install Microsoft.WindowsAppSDK `
                -Version 2.7.0 `
                -Source $source `
                -OutputDirectory $outputDirectory `
                -DependencyVersion Ignore `
                -NoCache `
                -DirectDownload `
                -NonInteractive `
                -Verbosity detailed
            $installExitCode = $LASTEXITCODE
            $ErrorActionPreference = 'Stop'
            $packagePath = Join-Path $outputDirectory 'Microsoft.WindowsAppSDK.2.7.0\Microsoft.WindowsAppSDK.2.7.0.nupkg'
            $downloaded = Test-Path -LiteralPath $packagePath
            $results += [pscustomobject]@{
                Source = $name
                ServiceIndex = $indexStatus
                NuGetExitCode = $installExitCode
                PackageDownloaded = $downloaded
            }
        }

        Write-Host '=== Hosted-agent comparison ==='
        $results | Format-Table -AutoSize | Out-String | Write-Host
        Write-Host 'Diagnostic only: no authentication, upstream changes, or dependency-closure validation.'
        exit 0
