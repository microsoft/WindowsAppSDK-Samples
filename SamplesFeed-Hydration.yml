parameters:
- name: HydrationMode
  type: string
  default: Branch
  values:
  - Branch
  - ValidateOnly
  - WindowsAppSDKVersion
- name: BranchOrVersion
  displayName: Branch / Version (default is triggering branch)
  type: string
  default: $(Build.SourceBranch)

trigger: none
pr: none

pool:
  vmImage: windows-2022

jobs:
- job: TestVisibleTarget
  timeoutInMinutes: 10
  steps:
  - checkout: self

  - task: PowerShell@2
    displayName: Test resolver without accessing feeds
    inputs:
      targetType: inline
      script: |
        Import-Module Pester -RequiredVersion 3.4.0
        $result = Invoke-Pester '$(Build.SourcesDirectory)\eng\Tests\ResolveSamplesFeedTarget.Tests.ps1' -PassThru
        if ($result.FailedCount -gt 0)
        {
            throw "$($result.FailedCount) resolver tests failed."
        }

  - task: PowerShell@2
    displayName: Verify native parameter expansion
    inputs:
      targetType: inline
      script: |
        if ($env:EXPECT_DEFAULT -eq 'True')
        {
            if ($env:HYDRATION_TARGET -ne $env:BUILD_SOURCEBRANCH -or
                $env:HYDRATION_TARGET -notlike 'refs/heads/*')
            {
                throw 'Default did not expand to the actual queued branch.'
            }
            Write-Host "Default expanded to queued branch: $env:HYDRATION_TARGET"

            if ($env:TEST_MODE -ne 'WindowsAppSDKVersion')
            {
                # The diagnostic topic branch must remain rejected by the guard.
                $rejection = $null
                try
                {
                    & '$(Build.SourcesDirectory)\eng\ResolveSamplesFeedTarget.ps1' -HydrationMode $env:TEST_MODE
                }
                catch
                {
                    $rejection = $_.Exception.Message
                }
                if ($rejection -notlike "The selected branch must be*received 'copilot/test-hydration-visible-target'.")
                {
                    throw 'Expanded diagnostic topic branch was not rejected as expected.'
                }
                Write-Host 'Expanded default correctly rejected the unprotected diagnostic branch.'
            }
        }
        else
        {
            Write-Host "Explicit target: $env:HYDRATION_TARGET"
        }
    env:
      EXPECT_DEFAULT: ${{ eq(parameters.BranchOrVersion, '$(Build.SourceBranch)') }}
      TEST_MODE: ${{ parameters.HydrationMode }}
      HYDRATION_TARGET: ${{ parameters.BranchOrVersion }}

  - ${{ if or(eq(parameters.HydrationMode, 'WindowsAppSDKVersion'), ne(parameters.BranchOrVersion, '$(Build.SourceBranch)')) }}:
    - task: PowerShell@2
      displayName: Validate and resolve hydration target
      inputs:
        filePath: '$(Build.SourcesDirectory)\eng\ResolveSamplesFeedTarget.ps1'
        arguments: -HydrationMode ${{ parameters.HydrationMode }}
      env:
        HYDRATION_TARGET: ${{ parameters.BranchOrVersion }}

    - task: PowerShell@2
      displayName: Verify resolved target reaches consumer
      inputs:
        targetType: inline
        script: |
          $expected = $env:HYDRATION_TARGET -replace '^refs/heads/', ''
          $resolved = if ($env:TEST_MODE -eq 'WindowsAppSDKVersion')
          {
              $env:RESOLVED_VERSION
          }
          else
          {
              $env:RESOLVED_BRANCH
          }
          if ($resolved -ne $expected)
          {
              throw 'Resolved target did not reach consumer.'
          }
          Write-Host "Resolved target reached consumer: $resolved"
      env:
        TEST_MODE: ${{ parameters.HydrationMode }}
        HYDRATION_TARGET: ${{ parameters.BranchOrVersion }}
        RESOLVED_BRANCH: $(EffectiveSamplesBranch)
        RESOLVED_VERSION: $(EffectiveWindowsAppSDKVersion)
